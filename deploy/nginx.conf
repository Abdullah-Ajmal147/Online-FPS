# nginx on the host in front of the game and API containers (instead of the bundled Caddy).
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sentinel
#   sudo ln -s /etc/nginx/sites-available/sentinel /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
#   docker compose -f docker-compose.yml -f deploy/docker-compose.nginx.yml up -d
#
# HTTPS once the domain points at the server:
#   sudo certbot --nginx -d play.example.com --redirect
# (certbot adds the certificate, the HTTP → HTTPS redirect and renewal to this file).
#
# Replace play.example.com below with your domain. "_" also answers on the server's plain IP
# (useful before the domain is ready).

# WebSocket upgrade for the game connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name play.example.com _;

    client_max_body_size 64k;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Prometheus metrics stay inside the server (curl localhost:2567/metrics, :8787/metrics).
    location = /metrics     { return 404; }
    location = /api/metrics { return 404; }

    # API: /api/profiles/... -> api /profiles/... (the trailing slash strips /api).
    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append ($proxy_add_x_forwarded_for): the API trusts the first
        # entry for IP bans and rate limits, so a player must not be able to supply it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: game page, assets, matchmaking and the game WebSocket.
    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The game server (Colyseus) takes the player's IP from X-Real-IP: always set it here.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A match runs 10+ minutes on one WebSocket: don't cut quiet-looking connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

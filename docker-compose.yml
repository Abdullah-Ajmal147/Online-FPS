# Local production-like run: `docker compose up --build`, then open http://localhost:2567
# Requires SENTINEL_API_SECRET (32+ random characters), e.g. in a .env file next to this one:
#   echo "SENTINEL_API_SECRET=$(openssl rand -hex 32)" > .env
services:
  game:
    build: .
    image: sentinel-strike
    ports:
      - '2567:2567'
    environment:
      SENTINEL_API_URL: http://api:8787
      SENTINEL_API_SECRET: ${SENTINEL_API_SECRET:?Set SENTINEL_API_SECRET to a random value of 32+ characters (see README)}
    depends_on:
      - api
    restart: unless-stopped
  api:
    image: sentinel-strike
    command: ['node', 'apps/api/dist/index.mjs']
    ports:
      - '8787:8787'
    environment:
      SENTINEL_API_SECRET: ${SENTINEL_API_SECRET:?Set SENTINEL_API_SECRET to a random value of 32+ characters (see README)}
      SENTINEL_DB: /data/sentinel.db
    volumes:
      - sentinel-data:/data
    restart: unless-stopped
volumes:
  sentinel-data:
